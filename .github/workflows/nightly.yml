name: Nightly

on:
  schedule:
    - cron: '0 2 * * *' # A — Light T4 (daily 02:00 UTC)
    - cron: '0 2 * * 1' # B — Supply chain (Monday 02:00 UTC)
    - cron: '0 2 1,15 * *' # C — Mutation (1st + 15th 02:00 UTC)
  workflow_dispatch:

jobs:
  # ── A — Light T4: full test suite + coverage ──────────────────────────────────
  nightly-tests-node:
    name: Node tests + coverage (nightly snapshot)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: bash scripts/ensure-native-deps.sh
      - run: mkdir -p .test-results .reports/coverage
      - run: npm run test:coverage
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-test-results-node-${{ github.run_number }}
          path: .test-results/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-coverage-node-${{ github.run_number }}
          path: .reports/coverage/
          retention-days: 30
          if-no-files-found: warn

  # ── A — Light T4: complexity report ───────────────────────────────────────────
  nightly-complexity:
    name: Complexity report (nightly snapshot)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    env:
      COMPLEXITY_NODE_WORKSPACES: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: bash scripts/complexity-report.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-complexity-${{ github.run_number }}
          path: .reports/complexity/
          retention-days: 30
          if-no-files-found: warn

  # ── C — Mutation: Node/TS Stryker ─────────────────────────────────────────────
  mutation-tests-node:
    name: Mutation testing — Node (Stryker)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 1,15 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm install --save-dev @stryker-mutator/core @stryker-mutator/vitest-runner
      - name: Run Stryker mutation tests
        run: npx stryker run || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-node-${{ github.run_number }}
          path: reports/mutation/
          retention-days: 30
          if-no-files-found: warn

  # ── A — Light T4: TruffleHog full git-history scan ────────────────────────────
  trufflehog-full:
    name: TruffleHog (full git history)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3
        with:
          path: ./
          base: ''
          extra_args: --only-verified

  # ── B — Supply chain: SBOM + license compliance ───────────────────────────────
  sbom:
    name: SBOM + license compliance
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0.17.0
        with:
          format: cyclonedx-json
          output-file: sbom.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-${{ github.run_number }}
          path: sbom.json
          retention-days: 90
          if-no-files-found: warn
      - name: License compliance (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          exit-code: '1'
          format: table
          scanners: license
          severity: HIGH,CRITICAL

  # ── B — Supply chain: Crash Override / Chalk ──────────────────────────────────
  crash-override:
    name: Crash Override — Chalk (SBOM + SAST + secrets)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 * * 1'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Set up Chalk
        uses: crashappsec/setup-chalk-action@main
        with:
          load: |
            https://chalkdust.io/run_sbom.c4m
            https://chalkdust.io/run_sast.c4m
            https://chalkdust.io/run_secret_scanner.c4m
      - name: Chalk insert — mark source tree with provenance
        run: chalk insert src/ scripts/ || true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Chalk wrap Docker build — SLSA L2 container attestation
        if: hashFiles('Dockerfile') != ''
        run: chalk docker build -t chalk-attested:${{ github.sha }} . || true
      - name: Upload Chalk report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chalk-report-${{ github.run_number }}
          path: ~/.local/chalk/chalk.log
          retention-days: 90
          if-no-files-found: warn

  # ── B — Supply chain: Meterian SCA + license ──────────────────────────────────
  meterian:
    name: Meterian SCA + license (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 * * 1'
    steps:
      - uses: actions/checkout@v4
      - name: Meterian SCA + license
        uses: MeterianHQ/meterian-github-action@v1.0.17
        env:
          METERIAN_API_TOKEN: ${{ secrets.METERIAN_API_TOKEN }}
        with:
          args: --min-security=95 --min-licensing=95

  # ── B — Supply chain: Container image scan ────────────────────────────────────
  container-scan:
    name: Container scan (Trivy image)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 * * 1'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t scan-target:${{ github.sha }} .
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan-target:${{ github.sha }}
          exit-code: '1'
          severity: HIGH,CRITICAL
          format: table
