name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      # Full history required: gitleaks-action scans PRs with git log base^..head
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Optional native modules (rollup, sharp) must match the runner OS/arch.
      # See scripts/ensure-native-deps.sh and docs/contributor-guide/development.md.
      - name: Install dependencies
        run: |
          npm ci
          bash scripts/ensure-native-deps.sh

      - name: Run ESLint
        run: npm run lint

      - name: Shellcheck
        run: shellcheck --external-sources scripts/*.sh start-services.sh stop-services.sh

      - name: Actionlint
        uses: rhysd/actionlint@v1.7.12

      - name: Markdownlint
        run: npm run lint:md

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run Vitest unit tests
        run: npm run test

      - name: Run Vitest with coverage
        run: npm run test:coverage

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
      - uses: actions/checkout@v6

      - name: Docker build smoke
        run: docker build -t rag-explorer:ci .
