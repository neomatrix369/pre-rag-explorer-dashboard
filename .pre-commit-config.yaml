# Maturity: Serious-lite — optional complement to Husky (lint-staged handles ESLint/Prettier).
# Mirrors CI hygiene + secrets checks. Full gates: ./scripts/quality-gates.sh --full
#
# Install:  pip install pre-commit && pre-commit install
# Run all:   pre-commit run --all-files

repos:
  # ── Hygiene ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]

  # ── Secrets ──────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.1
    hooks:
      - id: gitleaks
        args: [--config, .gitleaks.toml]

  # ── Shell, GitHub Actions, Markdown (also in CI + Husky lint:meta) ─
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^scripts/.*\.sh$

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.19.1
    hooks:
      - id: markdownlint-cli2

  # ── Typecheck + build (complements Husky lint-staged) ────
  - repo: local
    hooks:
      - id: verify
        name: npm verify (tsc + build)
        entry: npm run verify
        language: system
        pass_filenames: false
        files: \.(ts|tsx)$

      - id: pre-push-gates
        name: Full quality gates (pre-push)
        entry: bash scripts/pre-push-gates.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
